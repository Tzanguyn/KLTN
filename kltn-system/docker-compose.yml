services:
  postgres:
    image: postgres:16-alpine
    container_name: kltn-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: kltn_app
      POSTGRES_USER: kltn
      POSTGRES_PASSWORD: kltn_secret
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kltn -d kltn_app"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://kltn:kltn_secret@postgres:5432/kltn_app?schema=public
      PORT: 3000
      CORS_ORIGIN: http://localhost:5173
      JWT_ACCESS_SECRET: change-me-access-secret
      JWT_REFRESH_SECRET: change-me-refresh-secret
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:3000/api
    ports:
      - "5173:5173"
    depends_on:
      - backend
volumes:
  postgres_data:
